name: package-format

# Covers the acceptance criteria of issue #2 / ADR 0001 (.otapkg v1): the Rust package
# crate and CLI, the PyO3 bindings, the golden-fixture cross-language parity, the RAM
# budget regression guard, and the manifest JSON Schema. This is deliberately scoped to
# that surface, not a full-repo CI pipeline — other crates aren't built here yet.

on:
  push:
    paths:
      - "crates/ota-package/**"
      - "crates/ota-python/**"
      - "apps/ota-cli/**"
      - "python/ai_ota/packaging.py"
      - "python/ai_ota/__init__.py"
      - "python/tests/unit/test_golden_fixtures.py"
      - "python/pyproject.toml"
      - "docs/reference/schemas/manifest.schema.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/package-format.yml"
  pull_request:
    paths:
      - "crates/ota-package/**"
      - "crates/ota-python/**"
      - "apps/ota-cli/**"
      - "python/ai_ota/packaging.py"
      - "python/ai_ota/__init__.py"
      - "python/tests/unit/test_golden_fixtures.py"
      - "python/pyproject.toml"
      - "docs/reference/schemas/manifest.schema.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/package-format.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check -p ota-package -p ota-cli
      - name: cargo clippy
        run: cargo clippy -p ota-package -p ota-cli
      - name: cargo test (includes golden-fixture parity and RAM-budget tests)
        run: cargo test -p ota-package -p ota-cli

  python:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin and pytest
        run: pip install "maturin>=1.5,<2" pytest
      - name: Build and install the native extension
        working-directory: python
        run: maturin develop --release
      - name: pytest (golden-fixture parity)
        run: pytest python/tests/unit/test_golden_fixtures.py -v

  schema:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin and check-jsonschema
        run: pip install "maturin>=1.5,<2" check-jsonschema
      - name: Build and install the native extension
        working-directory: python
        run: maturin develop --release
      - name: Extract each fixture's manifest as JSON
        run: |
          mkdir -p /tmp/manifests
          python3 - <<'EOF'
          import json
          from ai_ota import packaging

          for name in ("minimal", "delta", "full"):
              parsed = packaging.inspect(f"crates/ota-package/tests/golden/v1/{name}.otapkg")
              with open(f"/tmp/manifests/{name}.json", "w") as f:
                  json.dump(parsed["manifest"], f)
          EOF
      - name: Validate against manifest.schema.json
        run: |
          check-jsonschema --schemafile docs/reference/schemas/manifest.schema.json \
            /tmp/manifests/minimal.json /tmp/manifests/delta.json /tmp/manifests/full.json
